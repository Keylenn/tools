<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottie / DotLottie 在线测试器</title>
    <!-- 引入 Tailwind CSS 用于快速美化 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 DotLottie Web 库 -->
    <script type="module">
        import { DotLottie } from 'https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-web/+esm';

        // 将 DotLottie 挂载到全局以便后续使用
        window.DotLottie = DotLottie;
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
    <style>
        /* 自定义棋盘格背景，用于展示透明通道 */
        .checkerboard {
            background-image: 
                linear-gradient(45deg, #e5e7eb 25%, transparent 25%), 
                linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e5e7eb 75%), 
                linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        canvas {
            max-width: 100%;
            max-height: 60vh;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col items-center py-10 px-4">

    <!-- 标题区域 -->
    <header class="mb-8 text-center">
        <h1 class="text-3xl font-bold mb-2">🎬 Lottie 在线测试器</h1>
        <p class="text-gray-500">支持 .json (Lottie) 和 .lottie (DotLottie) 格式</p>
    </header>

    <!-- 主容器 -->
    <main class="w-full max-w-4xl bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200 flex flex-col md:flex-row">
        
        <!-- 左侧：控制面板 -->
        <div class="w-full md:w-1/3 p-6 bg-gray-50 border-r border-gray-200 space-y-6">
            
            <!-- URL 输入 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">动画 URL</label>
                <div class="flex gap-2">
                    <input type="text" id="url-input" 
                        placeholder="https://..." 
                        class="flex-1 px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                        value="https://cdn.jsdelivr.net/gh/Keylenn/oss/lottie/jumping.lottie">
                    <button id="load-url-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
                        加载
                    </button>
                </div>
            </div>

            <!-- 文件上传 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">或上传本地文件</label>
                <input type="file" id="file-input" accept=".json,.lottie" 
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
            </div>

            <hr class="border-gray-200">

            <!-- 播放控制 -->
            <div class="space-y-4">
                <div class="flex gap-2">
                    <button id="play-pause-btn" class="flex-1 bg-gray-800 hover:bg-gray-900 text-white py-2 rounded-md text-sm font-medium transition-colors">
                        ⏸ 暂停
                    </button>
                    <button id="stop-btn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 py-2 rounded-md text-sm font-medium transition-colors">
                        ⏹ 停止
                    </button>
                </div>

                <!-- 速度控制 -->
                <div>
                    <div class="flex justify-between text-xs text-gray-500 mb-1">
                        <span>播放速度</span>
                        <span id="speed-value">1.0x</span>
                    </div>
                    <input type="range" id="speed-slider" min="0.1" max="3" step="0.1" value="1" 
                        class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                </div>

                <!-- 循环开关 -->
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" id="loop-toggle" checked class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                    <span class="text-sm text-gray-700">循环播放 (Loop)</span>
                </label>
            </div>

            <!-- 状态信息 -->
            <div id="status-msg" class="text-xs text-green-600 mt-4 break-all"></div>
        </div>

        <!-- 右侧：预览区域 -->
        <div class="w-full md:w-2/3 p-8 flex items-center justify-center checkerboard relative min-h-[400px]">
            <canvas id="lottie-canvas"></canvas>
            
            <!-- 加载遮罩 -->
            <div id="loading-overlay" class="absolute inset-0 bg-white/80 flex items-center justify-center hidden z-10">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
            </div>
        </div>
    </main>

    <footer class="mt-8 text-xs text-gray-400">
      &copy; 2026 Keylenn. Tools by Keylenn.
    </footer>

    <!-- 应用逻辑 -->
    <script>
        function initApp() {
            const DotLottie = window.DotLottie;
            if (!DotLottie) {
                console.error('DotLottie library failed to load');
                return;
            }

            // DOM 元素
            const canvas = document.querySelector('#lottie-canvas');
            const urlInput = document.getElementById('url-input');
            const loadUrlBtn = document.getElementById('load-url-btn');
            const fileInput = document.getElementById('file-input');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const stopBtn = document.getElementById('stop-btn');
            const speedSlider = document.getElementById('speed-slider');
            const speedValue = document.getElementById('speed-value');
            const loopToggle = document.getElementById('loop-toggle');
            const statusMsg = document.getElementById('status-msg');
            const loadingOverlay = document.getElementById('loading-overlay');

            let dotLottie = null;
            let isPlaying = true;

            // 初始化默认动画
            loadAnimation(urlInput.value);

            // --- 核心功能 ---

            function loadAnimation(src, isDataUrl = false) {
                // 显示加载状态
                loadingOverlay.classList.remove('hidden');
                statusMsg.textContent = '加载中...';
                statusMsg.className = 'text-xs text-blue-600 mt-4 break-all';

                // 销毁旧实例
                if (dotLottie) {
                    dotLottie.destroy();
                    dotLottie = null;
                }

                const config = {
                    autoplay: true,
                    loop: loopToggle.checked,
                    canvas: canvas,
                    speed: parseFloat(speedSlider.value),
                };

                // 根据来源类型设置 src 或 data
                if (isDataUrl) {
                    config.data = src; // 本地文件读取的 ArrayBuffer/String
                } else {
                    config.src = src;  // URL
                }

                try {
                    dotLottie = new DotLottie(config);

                    // 事件监听
                    dotLottie.addEventListener('load', () => {
                        loadingOverlay.classList.add('hidden');
                        statusMsg.textContent = `✅ 加载成功 | FPS: ${dotLottie.totalFrames} 帧`;
                        statusMsg.className = 'text-xs text-green-600 mt-4 break-all';
                        updatePlayButton(true);
                    });

                    dotLottie.addEventListener('loadError', (e) => {
                        loadingOverlay.classList.add('hidden');
                        statusMsg.textContent = `❌ 加载失败: ${e.message || '未知错误'}`;
                        statusMsg.className = 'text-xs text-red-600 mt-4 break-all';
                        console.error('Load Error:', e);
                    });

                    dotLottie.addEventListener('complete', () => {
                        if (!loopToggle.checked) {
                            updatePlayButton(false);
                        }
                    });

                } catch (err) {
                    loadingOverlay.classList.add('hidden');
                    statusMsg.textContent = `❌ 初始化失败: ${err.message}`;
                    statusMsg.className = 'text-xs text-red-600 mt-4 break-all';
                }
            }

            // --- 交互事件 ---

            // URL 加载
            loadUrlBtn.addEventListener('click', () => {
                const url = urlInput.value.trim();
                if (url) loadAnimation(url);
            });

            // 回车加载
            urlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') loadUrlBtn.click();
            });

            // 文件上传
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    // DotLottie web 支持直接传入 ArrayBuffer 作为 data
                    loadAnimation(event.target.result, true);
                };
                
                // .lottie 是二进制格式，需要用 readAsArrayBuffer
                // .json 是文本格式，但 readAsArrayBuffer 对两者都兼容（库内部会处理）
                if (file.name.endsWith('.json')) {
                    reader.readAsText(file);
                } else {
                    reader.readAsArrayBuffer(file);
                }
            });

            // 播放/暂停
            playPauseBtn.addEventListener('click', () => {
                if (!dotLottie) return;
                if (dotLottie.isPlaying) {
                    dotLottie.pause();
                    updatePlayButton(false);
                } else {
                    dotLottie.play();
                    updatePlayButton(true);
                }
            });

            // 停止
            stopBtn.addEventListener('click', () => {
                if (!dotLottie) return;
                dotLottie.stop();
                updatePlayButton(false);
            });

            // 速度调节
            speedSlider.addEventListener('input', (e) => {
                const speed = parseFloat(e.target.value);
                speedValue.textContent = `${speed.toFixed(1)}x`;
                if (dotLottie) dotLottie.setSpeed(speed);
            });

            // 循环切换
            loopToggle.addEventListener('change', (e) => {
                if (dotLottie) dotLottie.setLoop(e.target.checked);
            });

            // UI 辅助函数
            function updatePlayButton(playing) {
                isPlaying = playing;
                playPauseBtn.innerHTML = playing ? '⏸ 暂停' : '▶️ 播放';
                
                // 样式切换逻辑
                if (playing) {
                    // 暂停状态样式 (灰色)
                    playPauseBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                    playPauseBtn.classList.add('bg-gray-800', 'hover:bg-gray-900');
                } else {
                    // 播放状态样式 (蓝色)
                    playPauseBtn.classList.remove('bg-gray-800', 'hover:bg-gray-900');
                    playPauseBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                }
            }
        }
    </script>
</body>
</html>
